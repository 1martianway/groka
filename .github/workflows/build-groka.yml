# Build the groka binary (xai-grok-pager-bin) and upload as an artifact.
name: Build groka

# Nothing here runs automatically. groka is not published from CI — the binary
# is built locally, on demand, with `cargo build --release`. This file exists
# only as a manual escape hatch (Actions -> Build groka -> Run workflow) for
# the rare case someone wants a clean-room artifact without a local toolchain.
#
# It used to build on every push and PR, with a macOS leg in the matrix. macOS
# bills at 10x and this is a 13-40 minute Rust build, so eight pushes in August
# spent 1,332 of the org's 3,000 included minutes — for artifacts nobody
# downloaded. Together with toowl's per-release macOS builds that exhausted the
# allowance on 2026-08-17 and stopped every workflow in every repo.
on:
  workflow_dispatch:

concurrency:
  # Manual runs only now, so the old push/PR keying (commit sha per merge, to
  # stop a burst of merges cancelling each other's post-merge CI) has nothing
  # left to key on. One dispatch at a time per ref is all this needs.
  group: build-groka-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      # macOS only when asked for, or on the weekly canary.
      #
      # GitHub bills macOS minutes at 10x. This job's macOS leg is a 13-40
      # minute Rust build, so each push cost 130-400 minutes of the 3000-minute
      # monthly allowance — eight pushes in August consumed 1,332 of it, and
      # together with toowl's release builds that is what exhausted the org's
      # minutes on 2026-08-17. Linux still runs on every push and PR at 1x, so
      # nothing stops being compiled; what stops is compiling it twice on the
      # expensive runner for a binary nobody downloaded.
      matrix:
        include: ${{ fromJSON((github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && '[{"os":"ubuntu-latest","target":"x86_64-unknown-linux-gnu","artifact":"groka-linux-x86_64"},{"os":"macos-latest","target":"aarch64-apple-darwin","artifact":"groka-macos-aarch64"}]' || '[{"os":"ubuntu-latest","target":"x86_64-unknown-linux-gnu","artifact":"groka-linux-x86_64"}]') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev protobuf-compiler

      - name: Install system deps (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf || true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.0"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: groka-${{ matrix.target }}
          cache-targets: true

      - name: Build release binary
        run: cargo build -p xai-grok-pager-bin --release

      - name: Package as groka
        shell: bash
        run: |
          set -euo pipefail
          SRC="target/release/xai-grok-pager"
          test -x "$SRC"
          mkdir -p dist
          cp "$SRC" "dist/groka"
          chmod +x dist/groka
          "./dist/groka" --version || true
          ls -lh dist/groka

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/groka
          if-no-files-found: error
          retention-days: 14
