# Build the groka binary (xai-grok-pager-bin) and upload as an artifact.
name: Build groka

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Weekly macOS canary. Ordinary pushes build Linux only (see the matrix
    # below), so this is what still catches macOS-specific breakage — within
    # a week rather than within a push, which is the trade being made.
    - cron: '0 6 * * 1'

concurrency:
  # push events all land on refs/heads/main, so with a plain github.ref key
  # a burst of merges cancelled each other's post-merge CI — silently, since
  # this repo has no branch-protection required-check gate to catch it.
  # Keying push on the commit sha instead gives every merge its own group;
  # pull_request behavior (and PR-time speed) is unchanged.
  group: build-groka-${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      # macOS only when asked for, or on the weekly canary.
      #
      # GitHub bills macOS minutes at 10x. This job's macOS leg is a 13-40
      # minute Rust build, so each push cost 130-400 minutes of the 3000-minute
      # monthly allowance — eight pushes in August consumed 1,332 of it, and
      # together with toowl's release builds that is what exhausted the org's
      # minutes on 2026-08-17. Linux still runs on every push and PR at 1x, so
      # nothing stops being compiled; what stops is compiling it twice on the
      # expensive runner for a binary nobody downloaded.
      matrix:
        include: ${{ fromJSON((github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && '[{"os":"ubuntu-latest","target":"x86_64-unknown-linux-gnu","artifact":"groka-linux-x86_64"},{"os":"macos-latest","target":"aarch64-apple-darwin","artifact":"groka-macos-aarch64"}]' || '[{"os":"ubuntu-latest","target":"x86_64-unknown-linux-gnu","artifact":"groka-linux-x86_64"}]') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev protobuf-compiler

      - name: Install system deps (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf || true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.0"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: groka-${{ matrix.target }}
          cache-targets: true

      - name: Build release binary
        run: cargo build -p xai-grok-pager-bin --release

      - name: Package as groka
        shell: bash
        run: |
          set -euo pipefail
          SRC="target/release/xai-grok-pager"
          test -x "$SRC"
          mkdir -p dist
          cp "$SRC" "dist/groka"
          chmod +x dist/groka
          "./dist/groka" --version || true
          ls -lh dist/groka

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/groka
          if-no-files-found: error
          retention-days: 14
