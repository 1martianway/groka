name: Darwin

# Darwin groka binary on the existing toowl M1 runner. Dispatch-only so a
# PR cannot keep the Dedicated Host allocated (24h Apple-licence minimum).
# Labels are [self-hosted, macOS] — never `ci`. The Linux pool owns `ci`,
# and ci-infra's Mac idle check keys off `macOS`.
#
# Does not install onto the runner. Artifact only.

on:
  workflow_dispatch:

concurrency:
  group: groka-darwin
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build groka (aarch64-apple-darwin)
    runs-on: [self-hosted, macOS]
    timeout-minutes: 90
    env:
      CARGO_HOME: ${{ github.workspace }}/../.cargo-groka
      CARGO_TARGET_DIR: ${{ github.workspace }}/../.target-groka-darwin
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Ensure rustup
        run: |
          mkdir -p "$CARGO_HOME"
          export PATH="$CARGO_HOME/bin:$PATH"
          if ! rustup --version >/dev/null 2>&1 || ! cargo --version >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.94.0 --profile default --no-modify-path
          fi
          rustup show
          cargo --version

      - name: Ensure dotslash (bundled protoc)
        run: |
          export PATH="$CARGO_HOME/bin:$PATH"
          if ! command -v dotslash >/dev/null 2>&1; then
            cargo install dotslash --locked
          fi
          ./bin/protoc --version

      - name: Release build
        run: |
          export PATH="$CARGO_HOME/bin:$PATH"
          cargo build -p xai-grok-pager-bin --release
          BIN="${CARGO_TARGET_DIR}/release/xai-grok-pager"
          test -x "$BIN"
          mkdir -p dist
          cp "$BIN" dist/groka
          chmod +x dist/groka
          ./dist/groka --version
          git rev-parse --short HEAD

      - name: Upload groka
        uses: actions/upload-artifact@v4
        with:
          name: groka-aarch64-apple-darwin
          path: dist/groka
          if-no-files-found: error
          retention-days: 14
